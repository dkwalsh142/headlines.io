<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Headline Curation</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%93%B0</text></svg>" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f5f0;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #dedad2;
    --accent: #1a5fb4;
    --approve: #2e7d32;
    --reject: #c62828;
    --skip: #8a8a8a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a;
      --card-bg: #232326;
      --text: #eeeeee;
      --muted: #9a9a9a;
      --border: #38383c;
      --accent: #6fa8f5;
      --approve: #5fbf6a;
      --reject: #f26d6d;
      --skip: #9a9a9a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  select, button {
    font: inherit;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    padding: 8px 12px;
    cursor: pointer;
  }
  .progress { color: var(--muted); font-size: 0.85rem; margin-left: auto; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 24px;
    min-height: 180px;
  }
  .year {
    font-size: 2.6rem;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 14px;
    font-variant-numeric: tabular-nums;
  }
  .headline { font-size: 1.4rem; font-weight: 600; line-height: 1.35; margin-bottom: 14px; }
  .llm-note {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 0.82rem; color: var(--muted);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    border-radius: 8px; padding: 8px 10px; margin-bottom: 14px;
  }
  .llm-score { font-weight: 700; color: var(--accent); flex: none; }
  .meta { color: var(--muted); font-size: 0.85rem; display: flex; gap: 10px; flex-wrap: wrap; }
  .meta a { color: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }
  .section-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 22px 0 8px; }
  .grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .grid button { min-width: 44px; }
  .grid button.selected { border-color: var(--accent); background: var(--accent); color: #fff; }
  .actions { display: flex; gap: 10px; margin-top: 26px; }
  .actions button { flex: 1; padding: 12px; font-weight: 600; font-size: 0.95rem; }
  #approveBtn { border-color: var(--approve); color: var(--approve); }
  #approveBtn.ready { background: var(--approve); color: #fff; }
  #rejectBtn { border-color: var(--reject); color: var(--reject); }
  #skipBtn { color: var(--skip); }
  .hint { color: var(--muted); font-size: 0.78rem; margin-top: 10px; }
  kbd {
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 0 5px;
    font-size: 0.8em;
    font-family: inherit;
  }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 18px; font-size: 0.85rem; opacity: 0; transition: opacity 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .filters {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 14px; font-size: 0.85rem;
  }
  .filters-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filters-toggle {
    background: none; border: none; color: var(--muted); font: inherit;
    cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px;
  }
  .filters-body { margin-top: 10px; }
  .filters-body[hidden] { display: none; }
  .filter-group { margin-bottom: 10px; }
  .filter-group label { display: block; color: var(--muted); font-size: 0.75rem; margin-bottom: 4px; }
  .year-inputs { display: flex; align-items: center; gap: 6px; }
  .year-inputs input {
    width: 80px; font: inherit; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); padding: 5px 8px;
  }
  .chip-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: inherit; font-size: 0.8rem; border-radius: 999px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); padding: 4px 12px; cursor: pointer;
  }
  .chip.selected { border-color: var(--accent); background: var(--accent); color: #fff; }
  .filters-actions { display: flex; gap: 8px; margin-top: 8px; }
  .filters-actions button { font-size: 0.8rem; padding: 6px 12px; }
  .approved-breakdown {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.78rem; color: var(--muted);
  }
  .approved-breakdown b { color: var(--text); }

  .tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    font: inherit; font-weight: 600; font-size: 0.85rem; border: none; background: none;
    color: var(--muted); padding: 8px 4px; margin-right: 16px; cursor: pointer;
    border-bottom: 2px solid transparent; border-radius: 0;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-panel[hidden] { display: none; }

  .sched-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .sched-toolbar .progress { margin-left: auto; }
  .sched-section {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; margin-bottom: 18px;
  }
  .sched-section h2 { font-size: 0.95rem; margin: 0 0 12px; }
  .sched-warning {
    background: color-mix(in srgb, var(--reject) 12%, transparent);
    color: var(--reject); border-radius: 8px; padding: 8px 10px;
    font-size: 0.8rem; margin-bottom: 8px;
  }
  .sched-warning:last-child { margin-bottom: 0; }
  .headline-picker { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .headline-pick-row { display: flex; gap: 6px; align-items: center; }
  .headline-pick-row input {
    flex: 1; font: inherit; font-size: 0.85rem; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); padding: 7px 10px;
  }
  .headline-pick-row .pick-idx { color: var(--muted); font-size: 0.8rem; width: 18px; flex: none; }
  .headline-pick-preview { font-size: 0.75rem; color: var(--muted); padding-left: 24px; margin-top: -4px; }
  .sched-btn-row { display: flex; gap: 8px; }
  .pool-card, .day-card {
    border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px;
  }
  .pool-card-head, .day-card-head {
    display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px;
  }
  .badge {
    font-size: 0.7rem; font-weight: 600; border-radius: 999px; padding: 2px 8px;
    background: var(--bg); color: var(--muted); border: 1px solid var(--border);
  }
  .badge.assigned { color: var(--approve); border-color: var(--approve); }
  .badge.shipped { color: var(--accent); border-color: var(--accent); }
  .badge.missing { color: var(--reject); border-color: var(--reject); }
  .hl-list { list-style: none; margin: 0; padding: 0; font-size: 0.8rem; }
  .hl-list li { padding: 3px 0; color: var(--text); display: flex; gap: 6px; align-items: baseline; }
  .hl-list .hl-section { color: var(--muted); flex: none; min-width: 60px; }
  .hl-list .hl-missing { color: var(--reject); font-style: italic; }
  .hl-list-editable li { align-items: center; }
  .hl-move { display: flex; gap: 2px; flex: none; }
  .hl-move button {
    all: unset; cursor: pointer; color: var(--muted); font-size: 0.75rem; font-weight: 700;
    padding: 1px 5px; line-height: 1.4; border-radius: 4px; border: 1px solid var(--border);
  }
  .hl-move button:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
  .hl-move button:disabled { opacity: 0.3; cursor: default; }
  .hl-swap-row { display: block; padding: 4px 0; }
  .swap-panel {
    background: var(--bg); border: 1px solid var(--accent); border-radius: 8px; padding: 8px; width: 100%;
  }
  .swap-panel-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .swap-search {
    flex: 1; font: inherit; font-size: 0.8rem; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--text); padding: 5px 8px;
  }
  .swap-panel-row button[data-swap-cancel] {
    all: unset; cursor: pointer; color: var(--muted); font-weight: 700; padding: 0 6px;
  }
  .swap-panel-row button[data-swap-cancel]:hover { color: var(--reject); }
  .swap-results { max-height: 200px; overflow-y: auto; }
  .swap-result {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; font-size: 0.8rem;
    border-radius: 6px; cursor: pointer;
  }
  .swap-result:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .swap-result .b-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pool-card-actions, .day-card-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .pool-card-actions input, .day-card-actions input {
    font: inherit; font-size: 0.8rem; width: 130px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); padding: 5px 8px;
  }
  .pool-card-actions button, .day-card-actions button { font-size: 0.8rem; padding: 5px 10px; }
  .empty-inline { color: var(--muted); font-size: 0.82rem; padding: 8px 0; }

  .selected-tray {
    display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; min-height: 30px;
    padding: 8px; border: 1px dashed var(--border); border-radius: 10px;
  }
  .selected-tray:empty::before { content: 'No headlines selected yet — browse below and click to add (up to 5).'; color: var(--muted); font-size: 0.8rem; }
  .selected-row {
    display: flex; align-items: center; gap: 8px; background: var(--accent); color: #fff;
    border-radius: 8px; padding: 6px 8px 6px 10px; font-size: 0.8rem;
  }
  .selected-pos {
    flex: none; width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700;
  }
  .selected-expand {
    all: unset; cursor: pointer; color: #fff; opacity: 0.85; flex: none;
    padding: 2px 4px; line-height: 1; display: inline-flex; transition: transform 0.15s;
  }
  .selected-expand:hover { opacity: 1; }
  .selected-row.expanded .selected-expand { transform: rotate(90deg); }
  .selected-section {
    flex: none; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 5px;
    background: rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center;
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.02em;
  }
  .selected-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .selected-row.expanded .selected-text { white-space: normal; overflow: visible; text-overflow: clip; }
  .selected-row-actions { display: flex; gap: 2px; flex: none; }
  .selected-row-actions button {
    all: unset; cursor: pointer; color: #fff; opacity: 0.85; font-weight: 700;
    padding: 2px 6px; line-height: 1; border-radius: 4px;
  }
  .selected-row-actions button:hover:not(:disabled) { opacity: 1; background: rgba(255,255,255,0.18); }
  .selected-row-actions button:disabled { opacity: 0.3; cursor: default; }
  .selected-count { font-size: 0.78rem; color: var(--muted); margin-bottom: 10px; }
  .selected-count.ready { color: var(--approve); font-weight: 600; }
  .browser-toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .browser-toolbar input[type="text"] { flex: 1; min-width: 160px; }
  .browser-toolbar input, .browser-toolbar select {
    font: inherit; font-size: 0.82rem; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); padding: 6px 9px;
  }
  .browser-toolbar input[type="number"] { width: 80px; }
  .browser-toolbar label { display: flex; align-items: center; gap: 4px; font-size: 0.78rem; color: var(--muted); }
  .browser-results { max-height: 320px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; }
  .browser-row {
    display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; font-size: 0.82rem;
    border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .browser-row:last-child { border-bottom: none; }
  .browser-row:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .browser-row.picked { background: color-mix(in srgb, var(--approve) 14%, transparent); cursor: default; }
  .browser-row .b-year { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 700; width: 40px; flex: none; padding-top: 1px; }
  .browser-row .b-section { color: var(--muted); width: 60px; flex: none; padding-top: 1px; }
  .browser-row .b-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .browser-row.expanded .b-text { white-space: normal; overflow: visible; text-overflow: clip; }
  .browser-row .b-diff { color: var(--muted); flex: none; font-size: 0.75rem; padding-top: 1px; }
  .browser-row .b-expand {
    all: unset; cursor: pointer; color: var(--muted); flex: none; font-size: 0.75rem;
    padding: 2px 4px; line-height: 1; display: inline-flex; transition: transform 0.15s;
  }
  .browser-row .b-expand:hover { color: var(--accent); }
  .browser-row.expanded .b-expand { transform: rotate(90deg); }
  .browser-row .b-edit {
    all: unset; cursor: pointer; color: var(--muted); flex: none; font-size: 0.85rem;
    padding: 2px 4px; line-height: 1;
  }
  .browser-row .b-edit:hover { color: var(--accent); }
  .browser-row .b-text-edit {
    flex: 1; font: inherit; font-size: 0.82rem; border-radius: 6px; border: 1px solid var(--accent);
    background: var(--card-bg); color: var(--text); padding: 3px 6px;
  }
  .browser-count { font-size: 0.75rem; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Headlines Pipeline</h1>
  <div class="sub" id="pageSub">Review raw NYT headlines, approve with a difficulty + section, or reject/skip.</div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="curate">Curate</button>
    <button class="tab-btn" data-tab="schedule">Schedule</button>
  </div>

  <div id="curateTab" class="tab-panel">
  <div class="toolbar">
    <span class="progress" id="progress"></span>
  </div>

  <div class="filters">
    <div class="filters-row">
      <button class="filters-toggle" id="filtersToggle">Filters</button>
    </div>
    <div class="filters-body" id="filtersBody" hidden>
      <div class="filter-group">
        <label>Year range</label>
        <div class="year-inputs">
          <input type="number" id="yearMinInput" placeholder="min" />
          <span>–</span>
          <input type="number" id="yearMaxInput" placeholder="max" />
        </div>
      </div>
      <div class="filter-group">
        <label>Section</label>
        <div class="chip-grid" id="filterSectionGrid"></div>
      </div>
      <div class="filters-actions">
        <button id="applyFiltersBtn">Apply</button>
        <button id="clearFiltersBtn">Clear</button>
      </div>
    </div>
    <div class="approved-breakdown" id="approvedBreakdown"></div>
    <div class="approved-breakdown" id="approvedByDecade"></div>
  </div>

  <div id="card" class="card"></div>

  <div id="controls" hidden>
    <div class="section-title">Difficulty</div>
    <div class="grid" id="difficultyGrid"></div>

    <div class="section-title">Section</div>
    <div class="grid" id="sectionGrid"></div>

    <div class="actions">
      <button id="rejectBtn" title="Reject (r)">Reject</button>
      <button id="skipBtn" title="Skip (s)">Skip</button>
      <button id="approveBtn" title="Approve (a or Enter)">Approve</button>
    </div>
    <div class="hint">
      <kbd>1</kbd>-<kbd>5</kbd> difficulty · <kbd>a</kbd> approve · <kbd>r</kbd> reject · <kbd>s</kbd> skip
    </div>
  </div>
  </div>

  <div id="scheduleTab" class="tab-panel" hidden>
    <div class="sched-toolbar">
      <span class="progress" id="schedProgress"></span>
    </div>

    <div class="sched-section">
      <h2>Create pool</h2>
      <div id="createPoolWarnings"></div>

      <div class="selected-count" id="selectedCount">0 / 5 selected</div>
      <div class="selected-tray" id="selectedTray"></div>

      <div class="browser-toolbar">
        <input type="text" id="browseSearch" placeholder="Search approved headlines…" />
        <select id="browseSection"><option value="">All sections</option></select>
        <input type="number" id="browseYearMin" placeholder="year min" />
        <input type="number" id="browseYearMax" placeholder="year max" />
        <label><input type="checkbox" id="browseExcludeUsed" checked /> Hide already-scheduled</label>
        <label><input type="checkbox" id="browseExcludeInAnyPool" /> Hide already in a pool</label>
      </div>
      <div class="browser-results" id="browserResults"></div>
      <div class="browser-count" id="browserCount"></div>

      <div class="sched-btn-row" style="margin-top:12px;">
        <button id="createPoolBtn" disabled>Create pool</button>
      </div>
    </div>

    <div class="sched-section">
      <h2>Assign day</h2>
      <div id="assignDayWarnings"></div>
      <div class="sched-btn-row">
        <input type="date" id="assignDateInput" />
        <input type="text" id="assignPoolIdInput" placeholder="pool-0001" />
        <button id="assignDayBtn">Assign</button>
      </div>
    </div>

    <div class="sched-section">
      <h2>Build rounds</h2>
      <div id="buildRoundsWarnings"></div>
      <div class="sched-btn-row">
        <button id="buildRoundsBtn">Build rounds.json</button>
      </div>
      <div class="empty-inline" id="buildRoundsSummary"></div>
    </div>

    <div class="sched-section">
      <h2>Unassigned pools</h2>
      <div id="unassignedPools"></div>
    </div>

    <div class="sched-section">
      <h2>Schedule</h2>
      <div id="scheduleList"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const state = {
  queue: [],
  total: 0,
  approvedCount: 0,
  approvedBySection: {},
  approvedByDecade: {},
  pendingCount: 0,
  autoRejectedCount: 0,
  manualRejectedCount: 0,
  unscoredCount: 0,
  current: null,
  difficulty: null,
  section: null,
  filters: { yearMin: null, yearMax: null, sections: [] },
};

const els = {
  progress: document.getElementById('progress'),
  card: document.getElementById('card'),
  controls: document.getElementById('controls'),
  difficultyGrid: document.getElementById('difficultyGrid'),
  sectionGrid: document.getElementById('sectionGrid'),
  approveBtn: document.getElementById('approveBtn'),
  rejectBtn: document.getElementById('rejectBtn'),
  skipBtn: document.getElementById('skipBtn'),
  toast: document.getElementById('toast'),
  filtersToggle: document.getElementById('filtersToggle'),
  filtersBody: document.getElementById('filtersBody'),
  yearMinInput: document.getElementById('yearMinInput'),
  yearMaxInput: document.getElementById('yearMaxInput'),
  filterSectionGrid: document.getElementById('filterSectionGrid'),
  applyFiltersBtn: document.getElementById('applyFiltersBtn'),
  clearFiltersBtn: document.getElementById('clearFiltersBtn'),
  approvedBreakdown: document.getElementById('approvedBreakdown'),
  approvedByDecade: document.getElementById('approvedByDecade'),
};

let SECTIONS = [];

function showToast(msg) {
  els.toast.textContent = msg;
  els.toast.classList.add('show');
  setTimeout(() => els.toast.classList.remove('show'), 1200);
}

function buildPendingUrl() {
  const params = new URLSearchParams();
  if (state.filters.yearMin != null) params.set('yearMin', state.filters.yearMin);
  if (state.filters.yearMax != null) params.set('yearMax', state.filters.yearMax);
  if (state.filters.sections.length) params.set('sections', state.filters.sections.join(','));
  const qs = params.toString();
  return qs ? `/api/pending?${qs}` : '/api/pending';
}

async function loadPending() {
  const res = await fetch(buildPendingUrl());
  const data = await res.json();
  if (!res.ok) {
    els.card.innerHTML = `<div class="empty">${data.error}</div>`;
    els.controls.hidden = true;
    return;
  }
  if (!data.years.length) {
    els.card.innerHTML = `<div class="empty">No raw data yet — run fetch-nyt.js for at least one year first.</div>`;
    els.controls.hidden = true;
    return;
  }
  SECTIONS = data.sections;
  state.queue = data.pending;
  state.total = data.total;
  state.approvedCount = data.approvedCount;
  state.approvedBySection = data.approvedBySection ?? {};
  state.approvedByDecade = data.approvedByDecade ?? {};
  state.pendingCount = data.pendingCount;
  state.autoRejectedCount = data.autoRejectedCount ?? 0;
  state.manualRejectedCount = data.manualRejectedCount ?? 0;
  state.unscoredCount = data.unscoredCount ?? 0;
  renderSectionGrid();
  renderFilterSectionGrid();
  renderApprovedBreakdown();
  next();
}

function renderSectionGrid() {
  els.sectionGrid.innerHTML = SECTIONS.map(
    (s) => `<button data-section="${s}">${s}</button>`
  ).join('');
}

function renderFilterSectionGrid() {
  els.filterSectionGrid.innerHTML = SECTIONS.map(
    (s) => `<button type="button" class="chip${state.filters.sections.includes(s) ? ' selected' : ''}" data-filter-section="${s}">${s}</button>`
  ).join('');
}

function renderApprovedBreakdown() {
  els.approvedBreakdown.innerHTML = SECTIONS.map((s) => `<span>${s}: <b>${state.approvedBySection[s] ?? 0}</b></span>`).join('');

  const decades = Object.keys(state.approvedByDecade).sort((a, b) => parseInt(a) - parseInt(b));
  els.approvedByDecade.innerHTML = decades.length
    ? decades.map((d) => `<span>${d}: <b>${state.approvedByDecade[d]}</b></span>`).join('')
    : '<span>No approved headlines yet</span>';
}

function updateProgress() {
  const rejectedNote = state.autoRejectedCount ? ` · ${state.autoRejectedCount} auto-hidden` : '';
  const manualRejectedNote = state.manualRejectedCount ? ` · ${state.manualRejectedCount} rejected` : '';
  const unscoredNote = state.unscoredCount ? ` · ${state.unscoredCount} awaiting scoring` : '';
  const filterNote = (state.filters.yearMin != null || state.filters.yearMax != null || state.filters.sections.length)
    ? ' · filtered' : '';
  els.progress.textContent = `${state.approvedCount} approved · ${state.pendingCount} pending (of ${state.total})${rejectedNote}${manualRejectedNote}${unscoredNote}${filterNote}`;
}

function resetSelection() {
  state.difficulty = null;
  state.section = null;
  [...els.difficultyGrid.children].forEach((b) => b.classList.remove('selected'));
  [...els.sectionGrid.children].forEach((b) => b.classList.remove('selected'));
  updateApproveReadiness();
}

function updateApproveReadiness() {
  const ready = state.difficulty !== null && state.section !== null;
  els.approveBtn.classList.toggle('ready', ready);
}

function yearOf(record) {
  const year = Number(String(record.pubDate).slice(0, 4));
  return Number.isFinite(year) ? year : '????';
}

function next() {
  updateProgress();
  resetSelection();
  state.current = state.queue.shift() || null;

  if (!state.current) {
    const message = state.unscoredCount
      ? `Nothing to review right now — ${state.unscoredCount} headline${state.unscoredCount === 1 ? '' : 's'} still awaiting LLM scoring. Run score-headlines.js, or check back once scoring finishes.`
      : `No more pending headlines. Run fetch-nyt.js for more years.`;
    els.card.innerHTML = `<div class="empty">${message}</div>`;
    els.controls.hidden = true;
    return;
  }

  els.controls.hidden = false;
  const r = state.current;
  const llmNote = r.interestScore != null
    ? `<div class="llm-note"><span class="llm-score">${r.interestScore}/5</span><span>${escapeHtml(r.whyInteresting ?? '')}</span></div>`
    : '';
  els.card.innerHTML = `
    <div class="year">${yearOf(r)}</div>
    ${llmNote}
    <div class="headline">${escapeHtml(r.text)}</div>
    <div class="meta">
      <span>${r.pubDate ?? ''}</span>
      <span>${escapeHtml(r.section ?? 'unknown section')}</span>
      <a href="${r.sourceUrl}" target="_blank" rel="noopener">source ↗</a>
    </div>
  `;

  // Pre-select the model's suggested section as a starting point — still
  // just a suggestion, the reviewer can click a different one before approving.
  if (r.suggestedSection && SECTIONS.includes(r.suggestedSection)) {
    state.section = r.suggestedSection;
    [...els.sectionGrid.children].forEach((b) => b.classList.toggle('selected', b.dataset.section === r.suggestedSection));
    updateApproveReadiness();
  }

  // Re-fetch when the local queue gets low so we don't run out mid-session.
  if (state.queue.length < 5 && state.pendingCount > state.queue.length + 1) {
    fetch(buildPendingUrl()).then((r) => r.json()).then((data) => {
      if (data.pending) state.queue = data.pending.filter((p) => p.nytId !== state.current?.nytId);
    });
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

// Short badge per section for the "already selected" tray, so section is
// scannable at a glance. Single letters are unambiguous except the "s" group
// (sports/science/style), which gets 2-letter abbreviations instead.
const SECTION_ABBREV = {
  politics: 'P',
  world: 'W',
  business: 'B',
  sports: 'Sp',
  arts: 'A',
  science: 'Sc',
  opinion: 'O',
  style: 'St',
};

function sectionAbbrev(section) {
  return SECTION_ABBREV[section] ?? '?';
}

async function decide(action) {
  if (!state.current) return;
  if (action === 'approve' && (state.difficulty === null || state.section === null)) {
    showToast('Pick a difficulty and section first');
    return;
  }

  const res = await fetch('/api/decide', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      action,
      record: state.current,
      difficulty: state.difficulty,
      section: state.section,
    }),
  });
  const data = await res.json();
  if (!res.ok) {
    showToast(data.error || 'Something went wrong');
    return;
  }

  if (action === 'approve') {
    state.approvedCount = data.approvedCount ?? state.approvedCount + 1;
    showToast('Approved');
  } else {
    showToast(action === 'reject' ? 'Rejected' : 'Skipped');
  }
  state.pendingCount = Math.max(0, state.pendingCount - 1);
  next();
}

els.difficultyGrid.innerHTML = [1, 2, 3, 4, 5].map((d) => `<button data-difficulty="${d}">${d}</button>`).join('');

els.difficultyGrid.addEventListener('click', (e) => {

els.applyFiltersBtn.addEventListener('click', () => {

els.clearFiltersBtn.addEventListener('click', () => {

});

document.addEventListener('keydown', (e) => {
  if (e.key >= '1' && e.key <= '5') {
    state.difficulty = Number(e.key);
    [...els.difficultyGrid.children].forEach((b) => b.classList.toggle('selected', Number(b.dataset.difficulty) === state.difficulty));
    updateApproveReadiness();
  } else if (e.key === 'a' || e.key === 'Enter') {
    decide('approve');
  } else if (e.key === 'r') {
    decide('reject');
  } else if (e.key === 's') {
    decide('skip');
  }
});

function renderWarnings(container, warnings) {
  container.innerHTML = (warnings || []).map((w) => `<div class="sched-warning">${escapeHtml(w)}</div>`).join('');
}

// poolId + editable: when set, renders up/down reorder controls that persist
// via /api/reorder-pool (round scheduling doc §4.1 — array order is play
// order). Not offered for a shipped date's pool — that round is frozen.
function renderHeadlineList(headlines, { poolId, editable } = {}) {
  if (!headlines.length) return '<div class="empty-inline">No headlines.</div>';
  return `<ul class="hl-list${editable ? ' hl-list-editable' : ''}">${headlines.map((h, i) => {
    const isSwapping = editable && schedState.swapping && schedState.swapping.poolId === poolId && schedState.swapping.index === i;

    if (isSwapping) {
      return `<li class="hl-swap-row">${renderSwapPanel(poolId, i, headlines)}</li>`;
    }

    const moveBtns = editable ? `
      <span class="hl-move">
        <button type="button" data-reorder-pool="${escapeHtml(poolId)}" data-move-up="${i}" title="Move up" ${i === 0 ? 'disabled' : ''}>&uarr;</button>
        <button type="button" data-reorder-pool="${escapeHtml(poolId)}" data-move-down="${i}" title="Move down" ${i === headlines.length - 1 ? 'disabled' : ''}>&darr;</button>
        <button type="button" data-swap-start-pool="${escapeHtml(poolId)}" data-swap-start-index="${i}" title="Swap this headline for another">&#8644;</button>
      </span>` : '';
    if (!h.found) {
      return `<li>${moveBtns}<span class="hl-section">?</span><span class="hl-missing">${escapeHtml(h.id)} — not found in approved.json</span></li>`;
    }
    return `<li>${moveBtns}<span class="hl-section">${escapeHtml(h.section ?? '')}</span><span>${escapeHtml(h.text)} <span style="color:var(--muted)">(${h.year ?? '?'})</span></span></li>`;
  }).join('')}</ul>`;
}

function renderSwapPanel(poolId, index, headlines) {
  const currentIds = new Set(headlines.map((h) => h.id));
  const results = schedState.swapResults.filter((r) => !currentIds.has(r.id));
  return `
    <div class="swap-panel">
      <div class="swap-panel-row">
        <input type="text" class="swap-search" data-swap-search placeholder="Search approved headlines to swap in…" autofocus />
        <button type="button" data-swap-cancel title="Cancel">&times;</button>
      </div>
      <div class="swap-results">
        ${results.length
          ? results.slice(0, 30).map((r) => `
            <div class="swap-result" data-swap-pick="${escapeHtml(r.id)}">
              <span class="b-year">${r.year}</span>
              <span class="b-section">${escapeHtml(r.section ?? '')}</span>
              <span class="b-text">${escapeHtml(r.text)}</span>
            </div>
          `).join('')
          : '<div class="empty-inline" style="padding:6px 0;">Type to search…</div>'}
      </div>
    </div>
  `;
}

function bindSwapControls(container, headlinesByPoolId) {
  container.querySelectorAll('[data-swap-start-pool]').forEach((btn) => {
    btn.addEventListener('click', () => {
      schedState.swapping = { poolId: btn.dataset.swapStartPool, index: Number(btn.dataset.swapStartIndex) };
      schedState.swapResults = [];
      renderScheduleState();
      const input = container.querySelector('[data-swap-search]');
      if (input) input.focus();
    });
  });
  container.querySelectorAll('[data-swap-cancel]').forEach((btn) => {
    btn.addEventListener('click', () => {
      schedState.swapping = null;
      renderScheduleState();
    });
  });
  const searchInput = container.querySelector('[data-swap-search]');
  if (searchInput) {
    searchInput.addEventListener('input', () => {
      clearTimeout(schedState.swapTimer);
      const q = searchInput.value.trim();
      schedState.swapTimer = setTimeout(async () => {
        if (!q) { schedState.swapResults = []; renderScheduleState(); return; }
        const res = await fetch(`/api/approved-headlines?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        if (res.ok) { schedState.swapResults = data.results; renderScheduleState(); }
      }, 250);
    });
  }
  container.querySelectorAll('[data-swap-pick]').forEach((row) => {
    row.addEventListener('click', () => doSwap(row.dataset.swapPick));
  });
}

async function doSwap(newHeadlineId) {
  if (!schedState.swapping) return;
  const { poolId, index } = schedState.swapping;
  const res = await fetch('/api/replace-pool-headline', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ poolId, index, newHeadlineId }),
  });
  const data = await res.json();
  if (!res.ok) {
    showToast(data.error || 'Failed to swap');
    return;
  }
  schedState.swapping = null;
  schedState.swapResults = [];
  showToast('Swapped');
  loadScheduleState();
}

async function reorderExistingPool(poolId, headlines, index, delta) {
  const target = index + delta;
  if (target < 0 || target >= headlines.length) return;
  const reordered = headlines.slice();
  const [item] = reordered.splice(index, 1);
  reordered.splice(target, 0, item);

  const res = await fetch('/api/reorder-pool', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ poolId, orderedIds: reordered.map((h) => h.id) }),
  });
  const data = await res.json();
  if (!res.ok) {
    showToast(data.error || 'Failed to reorder');
    return;
  }
  showToast('Reordered');
  loadScheduleState();
}

function bindReorderButtons(container, headlinesByPoolId) {
  container.querySelectorAll('[data-reorder-pool][data-move-up]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const poolId = btn.dataset.reorderPool;
      reorderExistingPool(poolId, headlinesByPoolId(poolId), Number(btn.dataset.moveUp), -1);
    });
  });
  container.querySelectorAll('[data-reorder-pool][data-move-down]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const poolId = btn.dataset.reorderPool;
      reorderExistingPool(poolId, headlinesByPoolId(poolId), Number(btn.dataset.moveDown), 1);
    });
  });
}

// --- Selection tray (exactly 5 required to create a pool) ---
// Tray order IS play order (round scheduling design doc §4.1 — array order,
// no separate `position` field) — reorder buttons move headlines within
// schedState.selected directly.

function moveSelected(index, delta) {
  const target = index + delta;
  if (target < 0 || target >= schedState.selected.length) return;
  const [item] = schedState.selected.splice(index, 1);
  schedState.selected.splice(target, 0, item);
  renderSelectedTray();
}

// Mirrors buildPoolWarnings in curate-ui-server.js — computed here too so the
// same-decade/same-section/missing-in-approved warnings show up live while
// still picking, not just after clicking "Create pool".
function computeSelectionWarnings(selected) {
  const warnings = [];
  for (const h of selected) {
    if (h.section == null) warnings.push(`Headline id "${h.id}" not found in approved.json — will be stored as-is.`);
  }
  const sections = new Set(selected.map((h) => h.section));
  if (selected.length > 1 && sections.size === 1) {
    warnings.push(`All ${selected.length} headlines share the same section ("${[...sections][0]}") — no variety.`);
  }
  const decadeCounts = new Map();
  for (const h of selected) {
    if (h.year == null) continue;
    const decade = Math.floor(h.year / 10) * 10;
    decadeCounts.set(decade, (decadeCounts.get(decade) ?? 0) + 1);
  }
  const repeatedDecades = [...decadeCounts.entries()].filter(([, count]) => count > 1);
  if (repeatedDecades.length) {
    const desc = repeatedDecades.map(([decade, count]) => `${decade}s (${count})`).join(', ');
    warnings.push(`Two or more headlines fall in the same decade: ${desc}.`);
  }
  return warnings;
}

function renderSelectedTray() {
  schedEls.selectedTray.innerHTML = schedState.selected.map((h, i) => `
    <div class="selected-row${schedState.expandedSelectedIds.has(h.id) ? ' expanded' : ''}">
      <span class="selected-pos">${i + 1}</span>
      <button type="button" class="selected-expand" data-expand-selected="${escapeHtml(h.id)}" title="Expand/collapse full text">&#8250;</button>
      <span class="selected-section" title="${escapeHtml(h.section ?? 'unknown section')}">${sectionAbbrev(h.section)}</span>
      <span class="selected-text" data-expand-selected="${escapeHtml(h.id)}" title="Click to expand/collapse">${h.year} · ${escapeHtml(h.text)}</span>
      <span class="selected-row-actions">
        <button type="button" data-move-up="${i}" title="Move up" ${i === 0 ? 'disabled' : ''}>&uarr;</button>
        <button type="button" data-move-down="${i}" title="Move down" ${i === schedState.selected.length - 1 ? 'disabled' : ''}>&darr;</button>
        <button type="button" data-remove="${escapeHtml(h.id)}" title="Remove">&times;</button>
      </span>
    </div>
  `).join('');
  schedEls.selectedTray.querySelectorAll('[data-remove]').forEach((btn) => {
    btn.addEventListener('click', () => {
      schedState.selected = schedState.selected.filter((h) => h.id !== btn.dataset.remove);
      renderSelectedTray();
      renderBrowserResults(schedState.lastBrowseResults || []);
    });
  });
  schedEls.selectedTray.querySelectorAll('[data-move-up]').forEach((btn) => {
    btn.addEventListener('click', () => moveSelected(Number(btn.dataset.moveUp), -1));
  });
  schedEls.selectedTray.querySelectorAll('[data-move-down]').forEach((btn) => {
    btn.addEventListener('click', () => moveSelected(Number(btn.dataset.moveDown), 1));
  });
  schedEls.selectedTray.querySelectorAll('[data-expand-selected]').forEach((el) => {
    el.addEventListener('click', () => {
      const id = el.dataset.expandSelected;
      if (schedState.expandedSelectedIds.has(id)) schedState.expandedSelectedIds.delete(id);
      else schedState.expandedSelectedIds.add(id);
      renderSelectedTray();
    });
  });
  const n = schedState.selected.length;
  schedEls.selectedCount.textContent = `${n} / 5 selected${n ? ' — order = play order' : ''}`;
  schedEls.selectedCount.classList.toggle('ready', n === 5);
  schedEls.createPoolBtn.disabled = n !== 5;
  renderWarnings(schedEls.createPoolWarnings, computeSelectionWarnings(schedState.selected));
}

function toggleSelect(headline) {
  const idx = schedState.selected.findIndex((h) => h.id === headline.id);
  if (idx !== -1) {
    schedState.selected.splice(idx, 1);
  } else {
    if (schedState.selected.length >= 5) {
      showToast('Already have 5 selected — remove one first');
      return;
    }
    schedState.selected.push(headline);
  }
  renderSelectedTray();
  renderBrowserResults(schedState.lastBrowseResults || []);
}

function renderBrowserResults(results) {
  schedState.lastBrowseResults = results;
  const selectedIds = new Set(schedState.selected.map((h) => h.id));
  schedEls.browserResults.innerHTML = results.length
    ? results.map((h) => {
      const editing = schedState.editingBrowseId === h.id;
      const textCell = editing
        ? `<input type="text" class="b-text-edit" data-edit-input="${escapeHtml(h.id)}" value="${escapeHtml(h.text)}" />`
        : `<span class="b-text">${escapeHtml(h.text)}</span>`;
      return `
      <div class="browser-row${selectedIds.has(h.id) ? ' picked' : ''}${schedState.expandedBrowseIds.has(h.id) ? ' expanded' : ''}" data-pick="${escapeHtml(h.id)}">
        <span class="b-year">${h.year}</span>
        <span class="b-section">${escapeHtml(h.section ?? '')}</span>
        ${textCell}
        <span class="b-diff">${h.difficulty != null ? '★'.repeat(h.difficulty) : ''}</span>
        <button type="button" class="b-edit" data-edit-browse="${escapeHtml(h.id)}" title="Edit headline text">&#9998;</button>
        <button type="button" class="b-expand" data-expand-browse="${escapeHtml(h.id)}" title="Expand/collapse full text">&#8250;</button>
      </div>
    `;
    }).join('')
    : '<div class="empty-inline" style="padding:10px;">No matching approved headlines.</div>';

  schedEls.browserResults.querySelectorAll('[data-pick]').forEach((row) => {
    row.addEventListener('click', () => {
      if (schedState.editingBrowseId === row.dataset.pick) return; // don't select while editing
      const h = results.find((r) => r.id === row.dataset.pick);
      if (h) toggleSelect(h);
    });
  });
  schedEls.browserResults.querySelectorAll('[data-expand-browse]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.dataset.expandBrowse;
      if (schedState.expandedBrowseIds.has(id)) schedState.expandedBrowseIds.delete(id);
      else schedState.expandedBrowseIds.add(id);
      renderBrowserResults(results);
    });
  });
  schedEls.browserResults.querySelectorAll('[data-edit-browse]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      schedState.editingBrowseId = btn.dataset.editBrowse;
      renderBrowserResults(results);
      const input = schedEls.browserResults.querySelector('[data-edit-input]');
      if (input) { input.focus(); input.select(); }
    });
  });
  schedEls.browserResults.querySelectorAll('[data-edit-input]').forEach((input) => {
    input.addEventListener('click', (e) => e.stopPropagation());
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); saveBrowseEdit(input.dataset.editInput, input.value, results); }
      else if (e.key === 'Escape') { e.preventDefault(); schedState.editingBrowseId = null; renderBrowserResults(results); }
    });
    input.addEventListener('blur', () => saveBrowseEdit(input.dataset.editInput, input.value, results));
  });
}

async function saveBrowseEdit(id, newText, results) {
  if (schedState.editingBrowseId !== id) return; // already saved/cancelled (blur firing after Enter/Escape)
  schedState.editingBrowseId = null;

  const trimmed = newText.trim();
  const current = results.find((r) => r.id === id);
  if (!trimmed || (current && trimmed === current.text)) {
    renderBrowserResults(results);
    return;
  }

  const res = await fetch('/api/edit-approved-text', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, text: trimmed }),
  });
  const data = await res.json();
  if (!res.ok) {
    showToast(data.error || 'Failed to save edit');
    renderBrowserResults(results);
    return;
  }

  if (current) current.text = data.text;
  const selected = schedState.selected.find((h) => h.id === id);
  if (selected) { selected.text = data.text; renderSelectedTray(); }
  showToast('Headline updated');
  renderBrowserResults(results);
}

async function runBrowseSearch() {
  const params = new URLSearchParams();
  if (schedEls.browseSearch.value.trim()) params.set('q', schedEls.browseSearch.value.trim());
  if (schedEls.browseSection.value) params.set('section', schedEls.browseSection.value);
  if (schedEls.browseYearMin.value) params.set('yearMin', schedEls.browseYearMin.value);
  if (schedEls.browseYearMax.value) params.set('yearMax', schedEls.browseYearMax.value);
  if (schedEls.browseExcludeUsed.checked) params.set('excludeUsed', '1');
  if (schedEls.browseExcludeInAnyPool.checked) params.set('excludeInAnyPool', '1');

  const res = await fetch(`/api/approved-headlines?${params.toString()}`);
  const data = await res.json();
  if (!res.ok) {
    schedEls.browserCount.textContent = data.error || 'Failed to load.';
    return;
  }
  if (schedEls.browseSection.children.length <= 1) {
    schedEls.browseSection.innerHTML = '<option value="">All sections</option>' +
      data.sections.map((s) => `<option value="${s}">${s}</option>`).join('');
  }
  renderBrowserResults(data.results);
  schedEls.browserCount.textContent = `${data.total} matching headline${data.total === 1 ? '' : 's'}.`;
}

function debounceBrowseSearch() {
  clearTimeout(schedState.browseTimer);
  schedState.browseTimer = setTimeout(runBrowseSearch, 250);
}

schedEls.browseSearch.addEventListener('input', debounceBrowseSearch);
schedEls.browseSection.addEventListener('change', runBrowseSearch);
schedEls.browseYearMin.addEventListener('input', debounceBrowseSearch);
schedEls.browseYearMax.addEventListener('input', debounceBrowseSearch);
schedEls.browseExcludeUsed.addEventListener('change', runBrowseSearch);
schedEls.browseExcludeInAnyPool.addEventListener('change', runBrowseSearch);

schedEls.createPoolBtn.addEventListener('click', async () => {
  if (schedState.selected.length !== 5) {
    showToast('Select exactly 5 headlines first');
    return;
  }
  const res = await fetch('/api/create-pool', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ headlineIds: schedState.selected.map((h) => h.id) }),
  });
  const data = await res.json();
  if (!res.ok) {
    showToast(data.error || 'Something went wrong');
    return;
  }
  renderWarnings(schedEls.createPoolWarnings, data.warnings);
  showToast(`Created ${data.poolId}`);
  schedState.selected = [];
  renderSelectedTray();
  runBrowseSearch();
  loadScheduleState();
});

schedEls.assignDayBtn.addEventListener('click', () => assignDay());

async function assignDay(prefillDate, prefillPoolId) {
  const date = prefillDate ?? schedEls.assignDateInput.value;
  const poolId = prefillPoolId ?? schedEls.assignPoolIdInput.value.trim();
  if (!date || !poolId) {
    showToast('Pick a date and a pool id');
    return;
  }
  const res = await fetch('/api/assign-day', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ date, poolId }),
  });
  const data = await res.json();
  if (!res.ok) {
    showToast(data.error || 'Something went wrong');
    return;
  }
  renderWarnings(schedEls.assignDayWarnings, data.warnings);
  showToast(`Assigned ${date} -> ${poolId}`);
  schedEls.assignDateInput.value = '';
  schedEls.assignPoolIdInput.value = '';
  loadScheduleState();
}

async function unassignDay(date) {
  const res = await fetch('/api/unassign-day', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ date }),
  });
  const data = await res.json();
  if (!res.ok) {
    showToast(data.error || 'Something went wrong');
    return;
  }
  renderWarnings(schedEls.assignDayWarnings, data.warnings);
  showToast(`Unassigned ${date}`);
  loadScheduleState();
}

schedEls.buildRoundsBtn.addEventListener('click', async () => {
  const res = await fetch('/api/build-rounds', { method: 'POST' });
  const data = await res.json();
  if (!res.ok) {
    showToast(data.error || 'Something went wrong');
    return;
  }
  renderWarnings(schedEls.buildRoundsWarnings, data.warnings);
  schedEls.buildRoundsSummary.textContent =
    `${data.shippedCount} shipped (frozen) · ${data.rebuiltCount} built/rebuilt · ${data.skippedCount} skipped · rounds.json has ${data.total} entries`;
  showToast('rounds.json built');
  loadScheduleState();
});

function renderScheduleState() {
  schedEls.progress.textContent = `${schedState.approvedCount} approved headlines · ${schedState.pools.length} pool(s) · ${schedState.schedule.length} date(s) scheduled`;

  const unassigned = schedState.pools.filter((p) => !p.assigned);
  schedEls.unassignedPools.innerHTML = unassigned.length
    ? unassigned.map((pool) => `
      <div class="pool-card">
        <div class="pool-card-head">
          <span>${pool.id}</span>
          <span class="badge">unassigned</span>
        </div>
        ${renderHeadlineList(pool.headlines, { poolId: pool.id, editable: true })}
        <div class="pool-card-actions">
          <input type="date" data-assign-date-for="${pool.id}" />
          <button data-quick-assign="${pool.id}">Assign to date</button>
        </div>
      </div>
    `).join('')
    : '<div class="empty-inline">No unassigned pools.</div>';

  schedEls.unassignedPools.querySelectorAll('[data-quick-assign]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const poolId = btn.dataset.quickAssign;
      const dateInput = schedEls.unassignedPools.querySelector(`[data-assign-date-for="${poolId}"]`);
      if (!dateInput.value) {
        showToast('Pick a date first');
        return;
      }
      assignDay(dateInput.value, poolId);
    });
  });
  bindReorderButtons(schedEls.unassignedPools, (poolId) => unassigned.find((p) => p.id === poolId)?.headlines ?? []);
  bindSwapControls(schedEls.unassignedPools, (poolId) => unassigned.find((p) => p.id === poolId)?.headlines ?? []);

  schedEls.scheduleList.innerHTML = schedState.schedule.length
    ? schedState.schedule.map((entry) => `
      <div class="day-card">
        <div class="day-card-head">
          <span>${entry.date}</span>
          <span>&rarr;</span>
          <span>${entry.poolId}</span>
          ${entry.shipped ? '<span class="badge shipped">shipped</span>' : ''}
          ${entry.missingPool ? '<span class="badge missing">pool missing</span>' : ''}
        </div>
        ${renderHeadlineList(entry.headlines, { poolId: entry.poolId, editable: !entry.shipped && !entry.missingPool })}
        <div class="day-card-actions">
          <button data-unassign="${entry.date}" ${entry.shipped ? 'disabled title="Shipped rounds are frozen"' : ''}>Unassign</button>
        </div>
      </div>
    `).join('')
    : '<div class="empty-inline">No dates scheduled yet.</div>';

  schedEls.scheduleList.querySelectorAll('[data-unassign]').forEach((btn) => {
    btn.addEventListener('click', () => unassignDay(btn.dataset.unassign));
  });
  bindReorderButtons(schedEls.scheduleList, (poolId) => schedState.schedule.find((e) => e.poolId === poolId)?.headlines ?? []);
  bindSwapControls(schedEls.scheduleList, (poolId) => schedState.schedule.find((e) => e.poolId === poolId)?.headlines ?? []);
}

async function loadScheduleState() {
  const res = await fetch('/api/schedule-state');
  const data = await res.json();
  if (!res.ok) {
    schedEls.progress.textContent = data.error || 'Failed to load schedule state';
    return;
  }
  schedState.loaded = true;
  schedState.pools = data.pools;
  schedState.schedule = data.schedule;
  schedState.approvedCount = data.approvedCount;
  renderScheduleState();
}

renderSelectedTray();
</script>
</body>
</html>
